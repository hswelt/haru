<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluesky ハッシュタグ一覧</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f3f5f8;
      color: #111;
    }
    h1 {
      text-align: center;
      color: #0285ff;
      font-size: 1.5rem;
    }
    .post {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .author {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .author img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
      background: #ddd;
    }
    .handle {
      color: #666;
      font-size: 0.85rem;
      font-weight: normal;
      margin-left: 6px;
    }
    .text {
      white-space: pre-wrap;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .images img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
      max-height: 300px;
    }
    .meta {
      font-size: 0.8rem;
      color: #888;
      margin-top: 10px;
      text-align: right;
    }
    .meta a {
      color: #0285ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1 id="page-title">読み込み中...</h1>
  <div id="feed"></div>

  周南市美術博物館
  <script>
    // ▼ 表示したいハッシュタグを設定（# は不要）
    const TAG = '周南市美術博物館'; 
    // ▼ 取得する件数（最大100件）
    const LIMIT = 20;

    document.getElementById('page-title').textContent = `#${TAG} の投稿一覧`;

    async function loadPosts() {
      const feed = document.getElementById('feed');
      // Blueskyの公開検索API（認証不要）
      const url = `https://bsky.app{encodeURIComponent(TAG)}&limit=${LIMIT}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.posts || data.posts.length === 0) {
          feed.innerHTML = '<p style="text-align:center;">投稿が見つかりませんでした。</p>';
          return;
        }

        data.posts.forEach(post => {
          const author = post.author;
          const record = post.record;
          const date = new Date(record.createdAt).toLocaleString('ja-JP');
          
          // 投稿の元URLを生成
          const postId = post.uri.split('/').pop();
          const postUrl = `https://bsky.app{author.handle}/post/${postId}`;

          // 画像がある場合の処理
          let imagesHtml = '';
          if (post.embed && post.embed.images) {
            imagesHtml = '<div class="images">' + 
              post.embed.images.map(img => `<img src="${img.thumb}" alt="投稿画像" loading="lazy">`).join('') + 
              '</div>';
          }

          const card = document.createElement('div');
          card.className = 'post';
          card.innerHTML = `
            <div class="author">
              <img src="${author.avatar || ''}" alt="">
              <div>
                ${escapeHtml(author.displayName || author.handle)}
                <span class="handle">@${escapeHtml(author.handle)}</span>
              </div>
            </div>
            <div class="text">${escapeHtml(record.text)}</div>
            ${imagesHtml}
            <div class="meta">
              ${date} ・ <a href="${postUrl}" target="_blank" rel="noopener">Blueskyで見る ↗</a>
            </div>
          `;
          feed.appendChild(card);
        });
      } catch (err) {
        feed.innerHTML = '<p style="color:red; text-align:center;">データの取得に失敗しました。</p>';
        console.error(err);
      }
    }

    // XSS対策用のエスケープ関数
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    loadPosts();
  </script>

</body>
</html>
